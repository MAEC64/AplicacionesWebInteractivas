<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieReviews - Reseña</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark navbar-expand-md">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-collection-play"></i> Movie<span class="text-primary">Reviews</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav ms-auto mt-2 mt-md-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="btnFavoritos">
              <i class="bi bi-heart"></i> Favoritos
              <span class="badge bg-danger" id="favoritosCount">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div id="loadingSpinner" class="text-center d-flex align-items-center justify-content-center" style="min-height: 300px;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div id="errorContainer" class="container text-center d-none mt-4">
    <div class="alert alert-danger">
      No se encontró información de esta película.
      <a href="index.html" class="btn btn-outline-danger btn-sm ms-2">Volver al inicio</a>
    </div>
  </div>

  <div class="container my-5 d-none" id="detalleContainer">
    <a href="index.html" class="btn btn-outline-secondary btn-sm mb-4"><i class="bi bi-arrow-left"></i> Volver al catálogo</a>

    <div class="card detail-card">
      <div class="card-body p-4 p-lg-5">
        <div class="row g-4 g-lg-5">
          <div class="col-md-4 text-center">
            <img id="poster" src="" alt="" class="detail-poster">
          </div>
          <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
              <h2 id="titulo" class="mb-0"></h2>
              <button class="btn btn-outline-danger flex-shrink-0" id="btnFavoritoDetalle">
                <i class="bi bi-heart" id="iconoFavoritoDetalle"></i> Favorito
              </button>
            </div>

            <div class="detail-meta mb-4">
              <span id="anio"></span>
              <span>&middot;</span>
              <span><i class="bi bi-clock"></i> <span id="duracion"></span> min</span>
              <span>&middot;</span>
              <span id="clasificacion" class="badge bg-secondary"></span>
            </div>

            <div class="d-flex align-items-center flex-wrap gap-2 mb-4">
              <span class="display-6" id="rating"></span>
              <span class="fs-5" id="estrellas"></span>
              <span class="text-muted small">(<span id="numVotos"></span> votos)</span>
            </div>

            <p class="section-label">Géneros</p>
            <div class="mb-4" id="generos"></div>

            <div class="mb-4">
              <p class="section-label">Metascore</p>
              <div class="progress metascore-bar mb-1">
                <div class="progress-bar" id="metascoreBar" role="progressbar"></div>
              </div>
              <span id="metascoreTexto" class="small text-muted"></span>
            </div>

            <p class="section-label">Sinopsis</p>
            <p class="mb-4" id="sinopsis"></p>

            <p class="section-label">Intereses</p>
            <div class="mb-4" id="intereses"></div>

            <div class="row g-2 info-grid mb-4">
              <div class="col-6 col-lg-4">
                <div class="info-item"><strong>Idiomas</strong> <span id="idiomas"></span></div>
              </div>
              <div class="col-6 col-lg-4">
                <div class="info-item"><strong>Países</strong> <span id="paises"></span></div>
              </div>
              <div class="col-6 col-lg-4">
                <div class="info-item"><strong>Presupuesto</strong> <span id="presupuesto"></span></div>
              </div>
              <div class="col-6 col-lg-4">
                <div class="info-item"><strong>Recaudación</strong> <span id="recaudacion"></span></div>
              </div>
              <div class="col-12 col-lg-8">
                <div class="info-item"><strong>Productoras</strong> <span id="productoras"></span></div>
              </div>
            </div>

            <a href="#" target="_blank" id="btnTrailer" class="btn btn-danger">
              <i class="bi bi-play-fill"></i> Ver tráiler
            </a>

            <div class="mt-4">
              <p class="section-label">Enlaces externos</p>
              <div id="enlacesExternos" class="small"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="favoritosModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger">
            <i class="bi bi-heart-fill"></i> Mis Favoritos
            <span class="badge bg-danger" id="favoritosModalCount">0</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="favoritosModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-danger" id="btnEliminarTodos"><i class="bi bi-trash"></i> Eliminar todos</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="favs.js"></script>
  <script src="res.js"></script>
</body>
</html>
