<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieReviews - Inicio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark navbar-expand-md">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-collection-play"></i> Movie<span class="text-primary">Reviews</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto mt-2 mt-md-0">
          <li class="nav-item">
            <a class="nav-link active" href="index.html"><i class="bi bi-house-door"></i> Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="btnFavoritos">
              <i class="bi bi-heart"></i> Favoritos
              <span class="badge bg-danger" id="favoritosCount">0</span>
            </a>
          </li>
        </ul>
        <form class="d-flex mt-2 mt-md-0" id="formBuscador">
          <input class="form-control" type="search" id="buscador" placeholder="Buscar película...">
        </form>
      </div>
    </div>
  </nav>

  <header class="hero container text-center">
    <span class="eyebrow">Examen 1</span>
    <h1>Películas <span class="text-primary">Destacadas</span></h1>
    <p class="lead">Las mejores películas según la crítica y el público, listas para descubrir.</p>
    <div class="d-flex flex-wrap mt-4" id="filtrosDecada">
      <button type="button" class="btn active" data-decada="todos">Todos</button>
      <button type="button" class="btn" data-decada="1990-1999">1990-1999</button>
      <button type="button" class="btn" data-decada="2000-2009">2000-2009</button>
      <button type="button" class="btn" data-decada="2010-2019">2010-2019</button>
      <button type="button" class="btn" data-decada="2020-2026">2020-2026</button>
    </div>
  </header>

  <div id="loadingSpinner" class="text-center d-flex align-items-center justify-content-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div id="errorContainer" class="container text-center d-none">
    <div class="alert alert-danger">
      <p class="mb-2">No se pudieron cargar las películas.</p>
      <button class="btn btn-danger btn-sm" id="btnReintentar"><i class="bi bi-arrow-clockwise"></i> Reintentar</button>
    </div>
  </div>

  <div class="container mb-5">
    <div class="row g-4" id="moviesGrid"></div>
  </div>

  <div class="modal fade" id="favoritosModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger">
            <i class="bi bi-heart-fill"></i> Mis Favoritos
            <span class="badge bg-danger" id="favoritosModalCount">0</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="favoritosModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-danger" id="btnEliminarTodos"><i class="bi bi-trash"></i> Eliminar todos</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="favs.js"></script>
  <script src="ini.js"></script>
</body>
</html>
