<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Perfil | Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-10">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card border-dark rounded-3 shadow">
          <div class="card-header bg-dark text-white text-center py-3">
            <h5 class="mb-0">Mi Perfil</h5>
          </div>

          <div class="card-body text-center p-4">

<!--Avatar-->
            <img src="images/ph.jpg" alt="Foto de perfil"
class="rounded-circle border border-3 border-dark mb-3" width="120" height="120">

<!--Nombre y puesto-->
            <h4 class="card-title fw-bold mb-1">Miguel Angel Enriquez Cisneros</h4>
            <h6 class="text-muted mb-3">Game developer</h6>

<!--Descripción-->
            <p class="card-text text-start">
              Desarrollo de videojuegos mediante programacion de bajo nivel, conocimiento avanzado en motores graficos y conocimiento profundo en Vulkan y OpenGL.
            </p>

            <hr>

<!--Cosas que domina-->
            <p class="fw-bold text-start mb-2">Habilidades:</p>
            <ul class="list-group list-group-flush text-start mb-4">
              <li class="list-group-item">Python</li>
              <li class="list-group-item">OpenGL</li>
              <li class="list-group-item">Vulkan</li>
              <li class="list-group-item">C/C++</li>
              <li class="list-group-item">Unity</li>
            </ul>

<!-- Botón simple -->
            <a href="https://github.com/MAEC64" target="_blank"
class="btn btn-dark w-100">
              <i class="bi bi-github me-1"></i> Ver GitHub
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
